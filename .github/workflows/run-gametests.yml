name: Run all versions with Xvfb
on:
  workflow_dispatch:

jobs:
  define-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix_include: ${{ steps.set_matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse versions.json into matrix array
        id: set_matrix
        run: |
          filter='.versions[] | { mc: .version, modloader: .loaders[], java: .java } | . + { type: (if .modloader == "forge" then "lexforge" else .modloader end), regex: ".*\(.modloader).*" }'
          matrix_json=(jq -c "[filter]" ./versions.json)
          echo "matrix=matrix_json" >> "$GITHUB_OUTPUT"

  run-matrix:
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      matrix:
        version: ${{ fromJSON(needs.define-matrix.outputs.matrix_include) }}

    steps:
      - name: Run job for version
        run: |
          echo "Minecraft Version: ${{ matrix.version.mc }}"
          echo "Modloader: ${{ matrix.version.modloader }}"
          echo "Java Version: ${{matrix.version.java }}"
          echo "Type: ${{ matrix.version.type }}
          echo "Regex: ${{ matrix.version.regex }}
