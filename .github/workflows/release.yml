name: Publish Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      MOD_IS_RELEASE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from stonecutter.properties.toml
        id: version
        run: |
          read -r VERSION CHANNEL_TAG < <(python3 -c '
          import tomllib

          with open("stonecutter.properties.toml", "rb") as f:
              mod = tomllib.load(f).get("mod", {})

          print(mod.get("version", ""), mod.get("channel_tag", ""))
          ')
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          if [[ -z "$FULL_VERSION" ]]; then
            echo "::error::Could not read [mod].version from stonecutter.properties.toml."
            exit 1
          fi

          TAG_NAME="v${FULL_VERSION}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG_NAME}"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag_name }} already exists."
            exit 1
          fi

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com{{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --tag "${{ steps.version.outputs.tag_name }}" --strip header --output CHANGELOG.md
          version: 'v2.13.1'
          GITHUB_REPO: ${{ github.repository }}

      - name: Restore cliff.toml
        run: git checkout -- cliff.toml

      - name: Commit and Push Changelog
        id: changelog_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@://github.com'

          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): Update changelog for ${{ steps.version.outputs.tag_name }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and publish
        env:
          GITHUB_SHA: ${{ steps.changelog_commit.outputs.sha }}
          GITHUB_REF_NAME: ${{ steps.version.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB_GITHUB_ENABLE: ${{ vars.PUB_GITHUB_ENABLE }}
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
          PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
          PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
          PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
          PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
          PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
          PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
          PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
          PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
          PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
          PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
          PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishMods --stacktrace --no-daemon --max-workers=2 --console=plain

      - name: Revert Changelog Commit on Failure
        if: failure() && steps.changelog_commit.outputs.committed == 'true'
        run: |
          git revert --no-edit HEAD
          git push origin HEAD:${{ github.ref_name }}

      - name: Create annotated tag (if not created by publishMods)
        if: success() && vars.PUB_GITHUB_ENABLE != 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.tag_name }}"
          git push origin "${{ steps.version.outputs.tag_name }}"
